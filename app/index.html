<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Willak.space · Mi parcela</title>
<meta name="description" content="Registra tu parcela, mide el suelo, mira los riesgos con semáforo y genera un informe de trazabilidad.">
<meta name="theme-color" content="#1E5734">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/simbolo.png">
<!-- Leaflet va copiado en vendor/, así el sitio no depende de un CDN. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<!-- tokens.css = identidad (copia de 01-IDENTIDAD). tema.css = conecta esos colores a la web. estilos.css = disposición. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- Íconos: se dibujan una vez y se reutilizan con <use href="#i-nombre"> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mover" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dibujar" viewBox="0 0 24 24"><path d="M5 17l3-11 11 4-2 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="5" cy="17" r="2" fill="currentColor"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="19" cy="10" r="2" fill="currentColor"/><circle cx="17" cy="20" r="2" fill="currentColor"/></symbol>
    <symbol id="i-editar" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-distancia" viewBox="0 0 24 24"><path d="M3 16l5-5 3 3 5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-area" viewBox="0 0 24 24"><path d="M4 6l9-2 7 6-3 9-11-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-vaciar" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-importar" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-exportar" viewBox="0 0 24 24"><path d="M12 16V5m0 0L8 9m4-4l4 4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-capas" viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-chacra" viewBox="0 0 24 24"><path d="M12 21V11M12 11C12 7 9 5 5 5c0 4 3 6 7 6zM12 14c0-3 2-5 6-5 0 3-2 5-6 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-asesor" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-herr" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-ubic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ===== Barra superior ===== -->
  <header class="cabecera">
    <div class="marca">
      <a href="../index.html" class="marca-enlace" aria-label="Volver a Willak.space"><img class="marca-logo" src="assets/simbolo.png" alt="" height="30"><b class="marca-nombre">Willak<i>.space</i></b></a>
      <span class="marca-bajada">mi parcela</span>
      <span class="etiqueta-proto">Prototipo</span>
      <span id="marca-demo" class="rotulo-ilus" hidden>Datos ilustrativos</span>
    </div>
    <div class="cabecera-derecha">
      <span id="estado-red" class="estado-red" role="status" aria-live="polite" hidden></span>
      <button class="btn suave btn-demo" id="btn-demo" type="button" title="Carga la parcela Guaba CEIPA con datos ilustrativos">Parcela de prueba</button>
      <form id="buscar" class="buscar" role="search">
        <input type="search" id="buscar-txt" list="lugares" placeholder="Buscar lugar o pegar coordenadas" aria-label="Buscar un lugar o pegar coordenadas" autocomplete="off" enterkeyhint="search">
        <datalist id="lugares"></datalist>
        <button class="btn suave" type="submit" aria-label="Buscar"><svg width="20" height="20"><use href="#i-buscar"/></svg><span>Buscar</span></button>
      </form>
      <button class="btn suave btn-ubic" id="btn-ubic" type="button" aria-label="Ir a mi ubicación"><svg width="20" height="20"><use href="#i-ubic"/></svg><span>Mi ubicación</span></button>
      <span id="estado-guardado" class="estado-guardado" role="status" aria-live="polite"></span>
    </div>
  </header>

  <!-- ===== Herramientas (en el celular es una hoja deslizable) ===== -->
  <section id="hoja-herr" class="hoja herramientas" aria-label="Herramientas del mapa">
    <div class="hoja-asa" aria-hidden="true"></div>
    <div class="hoja-titulo"><strong>Herramientas</strong>
      <button class="cerrar" data-cerrar aria-label="Cerrar"><svg width="20" height="20"><use href="#i-cerrar"/></svg></button></div>
    <div class="herr-grupo" role="group" aria-label="Dibujo">
      <button class="herr principal" data-modo="punto"><svg><use href="#i-mas"/></svg><span>Nueva parcela</span></button>
      <button class="herr" data-modo="mover" aria-pressed="true"><svg><use href="#i-mover"/></svg><span>Mover</span></button>
      <button class="herr" data-modo="dibujar"><svg><use href="#i-dibujar"/></svg><span>Dibujar borde</span></button>
      <button class="herr" data-modo="editar"><svg><use href="#i-editar"/></svg><span>Editar</span></button>
    </div>
    <button class="herr solo-pc" id="btn-capas" type="button" aria-pressed="false"><svg><use href="#i-capas"/></svg><span>Capas y parcelas</span></button>
    <details class="herr-mas"><summary>Más herramientas</summary>
    <select id="tipo-dibujo" aria-label="Qué se va a dibujar">
    <option value="chacra">Dibujar: parcela</option>
    <option value="territorio">Dibujar: territorio</option>
    </select>
    <div class="herr-grupo" role="group" aria-label="Medir">
      <button class="herr" data-modo="distancia"><svg><use href="#i-distancia"/></svg><span>Distancia</span></button>
      <button class="herr" data-modo="area"><svg><use href="#i-area"/></svg><span>Área</span></button>
    </div>
    <div class="herr-grupo" role="group" aria-label="Archivos">
      <button class="herr" id="btn-importar"><svg><use href="#i-importar"/></svg><span>Importar</span></button>
      <button class="herr" id="btn-exportar"><svg><use href="#i-exportar"/></svg><span>Exportar</span></button>
      <button class="herr peligro" id="btn-vaciar"><svg><use href="#i-vaciar"/></svg><span>Vaciar</span></button>
      <input type="file" id="archivo-geojson" accept=".geojson,.json,application/geo+json,application/json" hidden>
    </div>
    </details>
  </section>

  <!-- ===== Capas (izquierda) ===== -->
  <aside id="hoja-capas" class="hoja panel panel-izq" aria-label="Capas">
    <div class="hoja-asa" aria-hidden="true"></div>
    <div class="hoja-titulo"><strong>Capas</strong>
      <button class="cerrar" data-cerrar aria-label="Cerrar"><svg width="20" height="20"><use href="#i-cerrar"/></svg></button></div>

    <div class="grupo">
      <h3>Mapa</h3>
      <div class="capa">
        <label class="interruptor"><input type="checkbox" id="cap-osm" checked><span class="pista"></span><span class="capa-nombre">Calles y nombres (sobre la foto satelital)</span></label>
        <input type="range" id="op-osm" min="10" max="100" value="100" aria-label="Transparencia de las calles">
      </div>
    </div>

    <div class="grupo">
      <h3>Tus dibujos</h3>
      <div class="capa">
        <label class="interruptor"><input type="checkbox" id="cap-chacra" checked><span class="pista"></span><span class="capa-nombre">Parcelas</span></label>
        <input type="range" id="op-chacra" min="0" max="100" value="35" aria-label="Relleno de las chacras">
      </div>
      <div class="capa">
        <label class="interruptor"><input type="checkbox" id="cap-territorio" checked><span class="pista"></span><span class="capa-nombre">Territorios</span></label>
        <input type="range" id="op-territorio" min="0" max="100" value="12" aria-label="Relleno de los territorios">
      </div>
      <div class="capa">
        <label class="interruptor"><input type="checkbox" id="cap-etiquetas" checked><span class="pista"></span><span class="capa-nombre">Nombres (etiquetas)</span></label>
      </div>
    </div>

    <div class="grupo">
      <h3>Parcelas <span id="n-lotes" class="contador">0</span></h3>
      <ul id="lista-lotes" class="lista-lotes"></ul>
    </div>
  </aside>

  <!-- ===== Mapa (centro) ===== -->
  <main class="zona-mapa">
    <div id="mapa" role="application" aria-label="Mapa de Napo"></div>
    <button id="fab-nueva" class="fab" type="button"><svg width="22" height="22"><use href="#i-mas"/></svg><span>Nueva parcela</span></button>
    <div id="lectura" class="lectura" role="status" aria-live="polite" hidden></div>
    <div id="accion-barra" class="accion-barra" hidden>
      <span id="accion-texto" class="accion-texto"></span>
      <div id="acc-gps" class="accion-botones gps" hidden>
        <button class="btn suave" id="acc-aqui" type="button">Punto con GPS</button>
        <button class="btn suave" id="acc-caminar" type="button" aria-pressed="false">Caminar con GPS</button>
        <button class="btn suave" id="acc-coord" type="button">Coordenadas</button>
      </div>
      <div id="acc-punto" class="accion-botones gps" hidden>
        <button class="btn suave" id="acc-ubic" type="button">Usar mi ubicación</button>
      </div>
      <span id="gps-estado" class="gps-estado" role="status" aria-live="polite" hidden></span>
      <div class="accion-botones">
        <button class="btn suave" id="acc-deshacer">Deshacer</button>
        <button class="btn suave" id="acc-quitar" hidden>Quitar punto</button>
        <button class="btn suave" id="acc-cancelar">Cancelar</button>
        <button class="btn" id="acc-terminar">Terminar</button>
      </div>
    </div>
  </main>

  <!-- ===== Chacra (derecha) ===== -->
  <aside id="hoja-lote" class="hoja panel panel-der" aria-label="Parcela seleccionada">
    <div class="hoja-asa" aria-hidden="true"></div>
    <div class="hoja-titulo"><strong>Parcela</strong>
      <button class="cerrar" data-cerrar aria-label="Cerrar"><svg width="20" height="20"><use href="#i-cerrar"/></svg></button></div>
    <div id="contenido-lote"></div>
  </aside>

  <!-- ===== Barra inferior (solo celular) ===== -->
  <nav class="nav-movil" aria-label="Secciones">
    <button data-abrir="hoja-herr"><svg><use href="#i-herr"/></svg><span>Herramientas</span></button>
    <button data-abrir="hoja-capas"><svg><use href="#i-capas"/></svg><span>Capas</span></button>
    <button data-abrir="hoja-lote"><svg><use href="#i-chacra"/></svg><span>Parcela</span></button>
    <button data-abrir="hoja-lote" data-pestana="siembra"><svg><use href="#i-asesor"/></svg><span>Qué sembrar</span></button>
  </nav>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<!-- Orden importa: cada archivo usa lo que dejó el anterior en window.Chakra -->
<script src="config.js"></script>      <!-- umbrales, pesos y catálogos: se cambian ahí, no en el código -->
<script src="js/estado.js"></script>
<script src="js/calculo.js"></script>   <!-- clima, suelo, pendiente -->
<script src="js/verdor.js"></script>    <!-- EVI y manejo de nubes -->
<script src="js/motor.js"></script>     <!-- recomendación, plan, alertas, señales -->
<script src="js/demo.js"></script>      <!-- parcela de prueba Guaba CEIPA (datos ilustrativos) -->
<script src="js/mapa.js"></script>
<script src="js/datos.js"></script>
<script src="js/servidor.js"></script>  <!-- habla con /api: verdor de AppEEARS y lluvia IMERG -->
<script src="js/ambiente.js"></script>
<script src="js/grafico.js"></script>
<script src="js/informe.js"></script>
<script src="js/asesor.js"></script>
<script src="js/parcela.js"></script>
<script src="js/paneles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
